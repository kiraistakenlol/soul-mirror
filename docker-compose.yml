version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soulmirror
      POSTGRES_PASSWORD: soulmirror
      POSTGRES_DB: soulmirror
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: ./apps/backend
    ports:
      - "8080:8080"
    env_file:
      - ./apps/backend/.env
    environment:
      - DATABASE_URL=postgresql://soulmirror:soulmirror@postgres:5432/soulmirror
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build: ./apps/frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  telegram-bot:
    build: ./apps/telegram-bot
    env_file:
      - ./apps/telegram-bot/.env
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
