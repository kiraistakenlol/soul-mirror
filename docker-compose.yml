version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soulmirror
      POSTGRES_PASSWORD: soulmirror
      POSTGRES_DB: soulmirror
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  backend:
    build: ./apps/backend
    ports:
      - "8080:8080"
    env_file:
      - ./apps/backend/.env
    environment:
      - DATABASE_URL=postgresql://soulmirror:soulmirror@postgres:5432/soulmirror
      - TELEGRAM_BOT_URL=http://telegram-bot:8082
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_BASE: http://api.soulmirror.kiraistaken.lol
    ports:
      - "3000:3000"
    restart: unless-stopped

  telegram-bot:
    build: ./apps/telegram-bot
    ports:
      - "8082:8082"
    env_file:
      - ./apps/telegram-bot/.env
    environment:
      - BACKEND_URL=http://backend:8080
      - CHANNELS_FILE=/app/data/channels.json
    volumes:
      - telegram_bot_data:/app/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  telegram_bot_data:
