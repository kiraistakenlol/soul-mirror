version: '3.8'

services:
  backend:
    build: ./apps/backend
    ports:
      - "8080:8080"
    env_file:
      - ./apps/backend/.env
    restart: unless-stopped

  frontend:
    build: ./apps/frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  telegram-bot:
    build: ./apps/telegram-bot
    env_file:
      - ./apps/telegram-bot/.env
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
