<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soul Mirror — Redesigned</title>
  <style>
    :root {
      --bg-primary: #1e1e1e;
      --bg-secondary: #2d2d30;
      --bg-tertiary: #383838;
      --text-primary: #cccccc;
      --text-secondary: #999999;
      --accent-blue: #007acc;
      --accent-green: #4ec9b0;
      --accent-yellow: #ffcc02;
      --accent-red: #f14c4c;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      --border: 1px solid #444444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      font-size: 14px;
    }

    /* --- Layout grid --- */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 20px 92px; /* extra bottom padding for sticky input */
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      grid-auto-rows: min-content;
      gap: 20px;
      grid-template-areas:
        "header header header"
        "profile notes results"
        "profile notes tools";
    }

    header.header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg-secondary);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }

    .logo { display: flex; gap: 10px; align-items: center; font-weight: 600; }
    .status-indicators { display: flex; gap: 16px; align-items: center; font-size: 12px; }
    .status-item { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent-green); }

    /* --- High-priority blocks --- */
    .profile-section { grid-area: profile; }
    .notes-section { grid-area: notes; }

    /* --- Secondary blocks --- */
    .results-section { grid-area: results; }
    .tools-card { grid-area: tools; }

    /* --- Cards --- */
    .card {
      background: var(--bg-secondary);
      border-radius: 10px;
      padding: 18px;
      box-shadow: var(--shadow);
      min-height: 0; /* allow child scroll */
    }

    .card-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 600; margin-bottom: 14px;
    }

    /* Profile emphasizes content */
    .profile-section .card-title { font-size: 20px; margin-bottom: 16px; }
    .profile-content {
      background: var(--bg-tertiary);
      border-left: 4px solid var(--accent-blue);
      border-radius: 8px;
      padding: 16px;
      max-height: 48vh;
      overflow: auto;
      white-space: pre-wrap;
    }

    /* Notes is the main canvas, tall and scrollable */
    .notes-section .card-title { margin-bottom: 10px; }
    #notes-list {
      max-height: 68vh;
      overflow: auto;
      display: flex; flex-direction: column; gap: 10px;
    }

    .note-item { background: var(--bg-tertiary); border-radius: 8px; padding: 12px; }
    .note-content { font-size: 13px; margin-bottom: 6px; white-space: pre-wrap; }
    .note-meta { display: flex; gap: 12px; font-size: 11px; color: var(--text-secondary); }
    .note-id { font-family: 'Courier New', monospace; }

    /* Latest response stays compact */
    .results-section .results-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .results-title { font-weight: 600; font-size: 16px; }
    .copy-btn { background: var(--bg-tertiary); border: var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
    .copy-btn:hover { background: var(--accent-blue); color: #fff; }
    .response { background: var(--bg-tertiary); border-left: 4px solid var(--accent-green); border-radius: 8px; padding: 12px; }

    /* Tools list */
    .tool-item { background: var(--bg-tertiary); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .tool-name { font-weight: 600; color: var(--accent-blue); margin-bottom: 4px; }
    .tool-description { color: var(--text-secondary); font-size: 13px; }

    /* --- Sticky input (full width, bottom dock) --- */
    .input-dock {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(6px);
      border-top: var(--border);
      box-shadow: 0 -6px 24px rgba(0,0,0,0.3);
      padding: 14px 16px;
      z-index: 10;
    }
    .input-inner {
      max-width: 1440px; margin: 0 auto; display: grid; gap: 10px;
      grid-template-columns: 1fr auto;
      align-items: end;
    }
    .input-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
    .input-area { width: 100%; background: var(--bg-tertiary); border: var(--border); border-radius: 10px; padding: 14px; color: var(--text-primary); font-family: inherit; font-size: 15px; line-height: 1.5; min-height: 64px; max-height: 180px; resize: none; overflow: auto; }
    .input-area:focus { outline: none; border-color: var(--accent-blue); }
    .process-btn { background: var(--accent-blue); color: white; border: none; border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .process-btn:disabled { background: var(--bg-tertiary); color: var(--text-secondary); cursor: not-allowed; }
    .process-btn .btn-spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
    .hint { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }

    /* Loading */
    .loading { display: none; align-items: center; gap: 10px; color: var(--accent-blue); font-weight: 600; }
    .spinner { width: 20px; height: 20px; border: 3px solid var(--bg-tertiary); border-top: 3px solid var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 1120px) {
      .container {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "header header"
          "profile results"
          "notes notes"
          "tools tools";
      }
      #notes-list { max-height: 50vh; }
      .profile-content { max-height: 32vh; }
    }
    @media (max-width: 760px) {
      .container {
        padding: 12px 12px 92px;
        gap: 12px;
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "profile"
          "notes"
          "results"
          "tools";
      }
      .card { padding: 14px; }
      .card-title { font-size: 16px; }
      .profile-content { max-height: 28vh; }
      #notes-list { max-height: 42vh; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo"><span>🧠</span><span>Soul Mirror</span></div>
      <div class="status-indicators">
        <div class="status-item"><div id="connection-status" class="status-dot"></div><span id="connection-text">Connected</span></div>
        <div class="status-item"><span>⚡</span><span id="tools-count">-</span><span>Tools</span></div>
      </div>
    </header>

    <!-- High priority: Profile -->
    <section class="card profile-section">
      <div class="card-title"><span>🧠</span><span>Your Soul Mirror Profile</span></div>
      <div id="profile-content" class="profile-content">Loading profile...</div>
    </section>

    <!-- High priority: Notes -->
    <section class="card notes-section">
      <div class="card-title"><span>📝</span><span>Your Notes (<span id="notes-count">-</span>)</span></div>
      <div id="notes-list"></div>
    </section>

    <!-- Secondary: Latest Response -->
    <section class="card results-section">
      <div class="results-header">
        <div class="results-title">💬 Latest Response</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <button id="copy-btn" class="copy-btn" onclick="copyResponse()" style="display:none">Copy JSON</button>
          <div id="loading" class="loading"><div class="spinner"></div><span>Processing...</span></div>
        </div>
      </div>
      <div id="response-container" style="display:none;">
        <div id="main-response" class="response"></div>
      </div>
    </section>

    <!-- Secondary: Tools -->
    <section class="card tools-card">
      <div class="card-title"><span>🔧</span><span>Tools (<span id="tools-count-detailed">-</span>)</span></div>
      <div id="tools-list"></div>
    </section>
  </div>

  <!-- Sticky input dock across the bottom -->
  <div class="input-dock">
    <div class="input-inner">
      <div>
        <div class="input-label">💭 What's on your mind?</div>
        <textarea id="user-input" class="input-area" placeholder="Type a thought, idea, or goal. Enter = send, Shift+Enter = new line" autofocus></textarea>
        <div class="hint">Tip: Press <strong>Esc</strong> to clear.</div>
      </div>
      <div>
        <button id="process-btn" class="process-btn" onclick="processInput()">
          <span id="btn-text">Process ↵</span>
          <div id="btn-spinner" class="btn-spinner" style="display: none;"></div>
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8080';
    let processedRequests = [];
    let currentResponseData = null;

    // Auto-resize textarea & keyboard shortcuts
    const textarea = document.getElementById('user-input');
    textarea.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 180) + 'px';
    });
    document.addEventListener('keydown', function (e) {
      // Allow Shift+Enter for newline, Enter to submit
      if (e.key === 'Enter' && !e.shiftKey && document.activeElement === textarea) {
        e.preventDefault();
        processInput();
      } else if (e.key === 'Escape') {
        textarea.value = '';
        textarea.style.height = 'auto';
      }
    });

    async function processInput() {
      const input = textarea.value.trim();
      if (!input) return;

      const processBtn = document.getElementById('process-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const loading = document.getElementById('loading');
      const responseContainer = document.getElementById('response-container');

      processBtn.disabled = true;
      btnText.textContent = 'Processing...';
      btnSpinner.style.display = 'block';
      loading.style.display = 'flex';
      responseContainer.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE}/api/process?input=${encodeURIComponent(input)}`);
        if (!response.ok) throw new Error('Processing failed');
        const data = await response.json();
        displayResults(data);
        processedRequests.push(data);
        textarea.value = '';
        textarea.style.height = 'auto';
      } catch (error) {
        displayError(error.message);
        processBtn.disabled = false;
        btnText.textContent = 'Process ↵';
        btnSpinner.style.display = 'none';
        loading.style.display = 'none';
      }
    }

    function displayResults(data) {
      currentResponseData = data;
      const mainResponse = document.getElementById('main-response');
      const copyBtn = document.getElementById('copy-btn');
      const loading = document.getElementById('loading');
      const responseContainer = document.getElementById('response-container');
      const processBtn = document.getElementById('process-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      
      mainResponse.innerHTML = `<pre style="white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 13px;">${JSON.stringify(data, null, 2)}</pre>`;
      copyBtn.style.display = 'inline-block';
      
      // Hide loading and show response
      loading.style.display = 'none';
      responseContainer.style.display = 'block';
      processBtn.disabled = false;
      btnText.textContent = 'Process ↵';
      btnSpinner.style.display = 'none';
      
      loadProfile();
      loadNotes();
    }

    function copyResponse() {
      if (!currentResponseData) return;
      const jsonString = JSON.stringify(currentResponseData, null, 2);
      navigator.clipboard.writeText(jsonString).then(() => {
        const copyBtn = document.getElementById('copy-btn');
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        copyBtn.style.background = 'var(--accent-green)';
        copyBtn.style.color = '#fff';
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.background = '';
          copyBtn.style.color = '';
        }, 900);
      });
    }

    function displayError(message) {
      const mainResponse = document.getElementById('main-response');
      const container = document.getElementById('response-container');
      container.style.display = 'block';
      mainResponse.innerHTML = `❌ Error: ${message}`;
      mainResponse.style.borderLeftColor = 'var(--accent-red)';
    }

    async function loadTools() {
      try {
        const res = await fetch(`${API_BASE}/api/tools`);
        const data = await res.json();
        const toolsCount = data.tools ? data.tools.length : 0;
        document.getElementById('tools-count').textContent = toolsCount;
        document.getElementById('tools-count-detailed').textContent = toolsCount;
        const toolsList = document.getElementById('tools-list');
        toolsList.innerHTML = (data.tools || []).map(tool => `
          <div class="tool-item">
            <div class="tool-name">${tool.name}</div>
            <div class="tool-description">${tool.description}</div>
          </div>`).join('');
      } catch { /* silent */ }
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${API_BASE}/api/profile`);
        const data = await res.json();
        let profileText = '';
        if (data.profile_notes && Object.keys(data.profile_notes).length > 0) {
          profileText = Object.values(data.profile_notes).map(n => n.content).join('\n\n');
        } else {
          profileText = 'No profile information yet. Start sharing your thoughts to build your profile.';
        }
        document.getElementById('profile-content').textContent = profileText;
      } catch {
        document.getElementById('profile-content').textContent = 'Failed to load profile';
      }
    }

    async function loadNotes() {
      try {
        const res = await fetch(`${API_BASE}/api/notes`);
        const data = await res.json();
        document.getElementById('notes-count').textContent = data.count || 0;
        const list = document.getElementById('notes-list');
        if (data.notes && Object.keys(data.notes).length > 0) {
          list.innerHTML = Object.values(data.notes)
            .sort((a, b) => new Date(b.created) - new Date(a.created))
            .map(note => `
              <div class="note-item">
                <div class="note-content">${note.content}</div>
                <div class="note-meta"><span class="note-id">ID: ${note.id}</span><span>Created: ${new Date(note.created).toLocaleDateString()}</span></div>
              </div>`).join('');
        } else {
          list.innerHTML = '<div class="note-item"><div class="note-content">No notes yet. Start sharing your thoughts!</div></div>';
        }
      } catch {
        document.getElementById('notes-list').innerHTML = '<div class="note-item"><div class="note-content">Failed to load notes</div></div>';
      }
    }

    async function checkStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/status`);
        const status = await res.json();
        const dot = document.getElementById('connection-status');
        const text = document.getElementById('connection-text');
        if (status.status === 'healthy') { dot.style.background = 'var(--accent-green)'; text.textContent = 'Connected'; }
        else { dot.style.background = 'var(--accent-red)'; text.textContent = 'Disconnected'; }
      } catch {
        const dot = document.getElementById('connection-status');
        const text = document.getElementById('connection-text');
        dot.style.background = 'var(--accent-red)';
        text.textContent = 'Disconnected';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTools();
      loadProfile();
      loadNotes();
      checkStatus();
      setInterval(checkStatus, 30000);
      setInterval(loadNotes, 10000);
    });
  </script>
</body>
</html>
