<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Mirror</title>
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d30;
            --bg-tertiary: #383838;
            --text-primary: #cccccc;
            --text-secondary: #999999;
            --accent-blue: #007acc;
            --accent-green: #4ec9b0;
            --accent-yellow: #ffcc02;
            --accent-red: #f14c4c;
            --shadow: 0 2px 8px rgba(0,0,0,0.15);
            --border: 1px solid #444444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
        }

        .status-indicators {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
        }

        .input-section {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .input-label {
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area {
            width: 100%;
            background: var(--bg-tertiary);
            border: var(--border);
            border-radius: 6px;
            padding: 15px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
            transition: border-color 0.2s ease;
        }

        .input-area:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .input-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quick-action {
            background: var(--bg-tertiary);
            border: var(--border);
            border-radius: 4px;
            padding: 5px 10px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-action:hover {
            background: var(--accent-blue);
            color: white;
        }

        .process-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .process-btn:hover {
            background: #005999;
        }

        .process-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .results-section {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .copy-btn {
            background: var(--bg-tertiary);
            border: var(--border);
            border-radius: 4px;
            padding: 5px 10px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--accent-blue);
            color: white;
        }

        .results-title {
            font-size: 16px;
            font-weight: 600;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--bg-tertiary);
            border-top: 2px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .response {
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-green);
        }

        .collapsible {
            background: var(--bg-tertiary);
            border: var(--border);
            border-radius: 6px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .collapsible-header {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            transition: background 0.2s ease;
        }

        .collapsible-header:hover {
            background: var(--bg-tertiary);
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .collapsible-content.active {
            max-height: 500px;
        }

        .collapsible-inner {
            padding: 15px;
        }

        .detail-item {
            margin-bottom: 10px;
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-item {
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .tool-name {
            font-weight: 600;
            color: var(--accent-blue);
            margin-bottom: 5px;
        }

        .tool-description {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .tool-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .profile-content {
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .performance-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 12px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .expand-icon {
            transition: transform 0.3s ease;
        }

        .expand-icon.rotated {
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                gap: 10px;
            }
            
            .input-controls {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <span>🧠</span>
                <span>Soul Mirror</span>
            </div>
            <div class="status-indicators">
                <div class="status-item">
                    <div class="status-dot" id="connection-status"></div>
                    <span id="connection-text">Connected</span>
                </div>
                <div class="status-item">
                    <span>⚡</span>
                    <span id="tools-count">-</span>
                    <span>Tools</span>
                </div>
            </div>
        </header>

        <div class="card" style="margin-bottom: 20px;">
            <div class="card-title">
                <span>📝</span>
                <span>Current Profile</span>
            </div>
            <div class="profile-content" id="profile-content">
                Loading profile...
            </div>
        </div>

        <div class="input-section">
            <div class="input-label">
                <span>💭</span>
                <span>What's on your mind?</span>
            </div>
            <textarea 
                id="user-input" 
                class="input-area" 
                placeholder="I want to learn guitar and improve my focus..."
                autofocus
            ></textarea>
            <div class="input-controls">
                <button id="process-btn" class="process-btn" onclick="processInput()">
                    <span>Process</span>
                    <span style="font-size: 12px;">↵</span>
                </button>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header">
                <div class="results-title">📊 Results</div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="copy-btn" id="copy-btn" onclick="copyResponse()" style="display: none;">Copy JSON</button>
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <span>Processing...</span>
                    </div>
                </div>
            </div>
            
            <div id="response-container" style="display: none;">
                <div class="response" id="main-response">
                    <!-- JSON response will be inserted here -->
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>🔧</span>
                <span>Available Tools (<span id="tools-count-detailed">-</span>)</span>
            </div>
            <div id="tools-list">
                <!-- Tools will be loaded here -->
            </div>
        </div>

    </div>

    <script>
        const API_BASE = 'http://localhost:8080';
        let processedRequests = [];
        
        // Auto-resize textarea
        const textarea = document.getElementById('user-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                processInput();
            } else if (e.key === 'Escape') {
                document.getElementById('user-input').value = '';
                document.getElementById('user-input').style.height = 'auto';
            }
        });


        async function processInput() {
            const input = document.getElementById('user-input').value.trim();
            if (!input) return;

            const processBtn = document.getElementById('process-btn');
            const loading = document.getElementById('loading');
            const responseContainer = document.getElementById('response-container');

            processBtn.disabled = true;
            loading.style.display = 'flex';
            responseContainer.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/api/process?input=${encodeURIComponent(input)}`);
                if (!response.ok) throw new Error('Processing failed');

                const data = await response.json();
                displayResults(data);
                processedRequests.push(data);
                
                // Clear input
                document.getElementById('user-input').value = '';
                textarea.style.height = 'auto';
                
            } catch (error) {
                displayError(error.message);
            } finally {
                processBtn.disabled = false;
                loading.style.display = 'none';
                responseContainer.style.display = 'block';
            }
        }

        let currentResponseData = null;

        function displayResults(data) {
            currentResponseData = data;
            const mainResponse = document.getElementById('main-response');
            const copyBtn = document.getElementById('copy-btn');
            
            mainResponse.innerHTML = `<pre style="white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 13px;">${JSON.stringify(data, null, 2)}</pre>`;
            copyBtn.style.display = 'block';
            
            // Refresh profile after processing
            loadProfile();
        }

        function copyResponse() {
            if (!currentResponseData) return;
            
            const jsonString = JSON.stringify(currentResponseData, null, 2);
            navigator.clipboard.writeText(jsonString).then(() => {
                const copyBtn = document.getElementById('copy-btn');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.style.background = 'var(--accent-green)';
                copyBtn.style.color = 'white';
                
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.style.background = '';
                    copyBtn.style.color = '';
                }, 1000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        function displayError(message) {
            const mainResponse = document.getElementById('main-response');
            mainResponse.innerHTML = `❌ Error: ${message}`;
            mainResponse.style.borderLeftColor = 'var(--accent-red)';
        }


        async function loadTools() {
            try {
                const response = await fetch(`${API_BASE}/api/tools`);
                const data = await response.json();
                
                document.getElementById('tools-count').textContent = data.count;
                document.getElementById('tools-count-detailed').textContent = data.count;
                
                const toolsList = document.getElementById('tools-list');
                toolsList.innerHTML = data.tools.map(tool => `
                    <div class="tool-item">
                        <div class="tool-name">${tool.name}</div>
                        <div class="tool-description">${tool.description}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load tools:', error);
            }
        }

        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE}/api/profile`);
                const data = await response.json();
                document.getElementById('profile-content').textContent = data.profile;
            } catch (error) {
                document.getElementById('profile-content').textContent = 'Failed to load profile';
            }
        }

        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                const status = await response.json();
                
                const connectionDot = document.getElementById('connection-status');
                const connectionText = document.getElementById('connection-text');
                
                if (status.status === 'healthy') {
                    connectionDot.style.background = 'var(--accent-green)';
                    connectionText.textContent = 'Connected';
                } else {
                    connectionDot.style.background = 'var(--accent-red)';
                    connectionText.textContent = 'Disconnected';
                }
            } catch (error) {
                const connectionDot = document.getElementById('connection-status');
                const connectionText = document.getElementById('connection-text');
                connectionDot.style.background = 'var(--accent-red)';
                connectionText.textContent = 'Disconnected';
            }
        }


        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            loadTools();
            loadProfile();
            checkStatus();
            
            // Refresh status every 30 seconds
            setInterval(checkStatus, 30000);
        });
    </script>
</body>
</html>
